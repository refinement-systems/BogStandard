SPECIFICATION Spec

\* Single-shot variant: each worker fires at most one boundary, modeling
\* the bs-run wrapper. See BogStandard.cfg for the long-running
\* dispatch.sh variant.

CONSTANTS
  MAX_BAILS   = 2
  SINGLE_SHOT = TRUE
  NULL        = NULL
  w1          = w1
  w2          = w2
  i1          = i1
  i2          = i2

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT OneIssuePerWorker
INVARIANT PhaseShapeOK
INVARIANT BailBound
INVARIANT MergeSoundness
INVARIANT DoneImpliesResolved
INVARIANT SingleShotMonotone
